name: Build Wrenmoor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tdir/"
          rm -f ./*.zip ./*.tpz

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Set version
        id: ver
        run: |
          v="0.1.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$v\"/" export_presets.cfg

      - name: Import project
        run: godot --headless --import

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/wrenmoor
          test -s build/linux/wrenmoor

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/wrenmoor.apk
          test -s build/android/wrenmoor.apk

      - name: Build RPM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          mkdir -p "$HOME/rpmbuild/RPMS"
          rpmbuild -bb packaging/wrenmoor.spec \
            --define "_wren_version ${{ steps.ver.outputs.version }}" \
            --define "_wren_src $GITHUB_WORKSPACE" \
            --define "_topdir $HOME/rpmbuild"
          cp "$HOME"/rpmbuild/RPMS/x86_64/wrenmoor-*.rpm build/

      - name: Collect release files
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p release
          cp build/android/wrenmoor.apk "release/wrenmoor-$v.apk"
          cp build/wrenmoor-*.rpm release/
          tar -czf "release/wrenmoor-$v-linux-x86_64.tar.gz" -C build/linux wrenmoor
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: wrenmoor-${{ steps.ver.outputs.version }}
          path: release/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Wrenmoor ${{ steps.ver.outputs.version }}
          body: |
            Automated build of commit ${{ github.sha }}.
            - **Android:** install `wrenmoor-${{ steps.ver.outputs.version }}.apk`
            - **Fedora:** `sudo dnf install ./wrenmoor-*.rpm`, then launch Wrenmoor from your app menu
            - **Other Linux:** extract the .tar.gz and run `./wrenmoor`
          files: release/*
